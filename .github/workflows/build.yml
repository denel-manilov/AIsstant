name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libegl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libportaudio2 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        shell: bash
        run: ./scripts/build-${{ matrix.platform }}.sh

      # ── Upload ────────────────────────────────────────────────────
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p artifacts
          case "${{ matrix.platform }}" in
            macos)  cp AIsstant-macos.zip artifacts/ ;;
            linux)  cp AIsstant-linux-x86_64.AppImage artifacts/ ;;
            windows) cp dist/AIsstant.exe artifacts/AIsstant-windows.exe ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIsstant-${{ matrix.platform }}
          path: artifacts/

  # ── GitHub Release (on tag push) ──────────────────────────────────
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
