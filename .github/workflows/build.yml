name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libegl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libportaudio2 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # ── macOS (.app) ──────────────────────────────────────────────
      - name: Build macOS .app
        if: matrix.platform == 'macos'
        run: |
          pyinstaller \
            --name AIsstant \
            --windowed \
            --onefile \
            --noconfirm \
            --collect-all sounddevice \
            --hidden-import aisstant.platform.darwin \
            --hidden-import aisstant.audio.system_capture \
            main.py
          cd dist && zip -ry ../AIsstant-macos.zip AIsstant.app

      # ── Linux (.AppImage) ─────────────────────────────────────────
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          pyinstaller \
            --name AIsstant \
            --onedir \
            --noconfirm \
            --collect-all sounddevice \
            --hidden-import aisstant.platform.linux \
            main.py

          # --- AppDir structure ---
          mkdir -p AIsstant.AppDir/usr/bin
          cp -r dist/AIsstant/* AIsstant.AppDir/usr/bin/

          # AppRun launcher
          cat > AIsstant.AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/AIsstant" "$@"
          APPRUN
          chmod +x AIsstant.AppDir/AppRun

          # .desktop entry
          cat > AIsstant.AppDir/AIsstant.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=AIsstant
          Exec=AIsstant
          Icon=AIsstant
          Type=Application
          Categories=Audio;Utility;
          Comment=AI-powered audio overlay assistant
          DESKTOP

          # Generate a 256x256 accent-colored PNG icon
          python3 << 'ICON'
          import struct, zlib
          w = h = 256
          raw = b""
          for _ in range(h):
              raw += b"\x00"
              for _ in range(w):
                  raw += bytes([86, 141, 229, 255])
          comp = zlib.compress(raw)
          def chunk(t, d):
              c = t + d
              crc = struct.pack(">I", zlib.crc32(c) & 0xFFFFFFFF)
              return struct.pack(">I", len(d)) + c + crc
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", comp)
          png += chunk(b"IEND", b"")
          with open("AIsstant.AppDir/AIsstant.png", "wb") as f:
              f.write(png)
          ICON

          # Download appimagetool and build the AppImage
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            AIsstant.AppDir AIsstant-linux-x86_64.AppImage

      # ── Windows (.exe) ────────────────────────────────────────────
      - name: Build Windows .exe
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          pyinstaller \
            --name AIsstant \
            --windowed \
            --onefile \
            --noconfirm \
            --collect-all sounddevice \
            --hidden-import aisstant.platform.windows \
            main.py

      # ── Upload ────────────────────────────────────────────────────
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p artifacts
          case "${{ matrix.platform }}" in
            macos)  cp AIsstant-macos.zip artifacts/ ;;
            linux)  cp AIsstant-linux-x86_64.AppImage artifacts/ ;;
            windows) cp dist/AIsstant.exe artifacts/AIsstant-windows.exe ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIsstant-${{ matrix.platform }}
          path: artifacts/

  # ── GitHub Release (on tag push) ──────────────────────────────────
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
